
name: Digital Wallet Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - '06_digital_wallet/**/*.py'
      - '.github/workflows/pytest.yml'

  pull_request:
    paths:
      - '06_digital_wallet/**/*.py'
      - '.github/workflows/pytest.yml'

  workflow_dispatch:

concurrency:
  group: digital-wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pytest
        run: python -m pip install pytest

      - name: Run Unit Tests
        working-directory: ./06_digital_wallet
        run: python -m pytest -v
